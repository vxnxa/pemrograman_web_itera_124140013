[app:main]
use = egg:pyramid_mahasiswa

pyramid.reload_templates = true
pyramid.debug_all = false
pyramid.default_locale_name = en

sqlalchemy.url = postgresql+psycopg2://pyramid_user:pyramid_pass@localhost:5432/pyramid_mahasiswa

[alembic]
script_location = %(here)s/pyramid_mahasiswa/alembic
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg2://pyramid_user:pyramid_pass@localhost:5432/pyramid_mahasiswa

[server:main]
use = egg:waitress#main
listen = localhost:6543

[loggers]
keys = root, sqlalchemy, pyramid

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_pyramid]
level = WARN
handlers =
qualname = pyramid

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
