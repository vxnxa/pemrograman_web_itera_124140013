[app:main]
use = egg:pyramid_mahasiswa
pyramid.reload_templates = false
pyramid.debug_all = false
pyramid.default_locale_name = en

# Atur sqlalchemy.url melalui environment/secret manager sebelum deployment.
sqlalchemy.url = postgresql+psycopg2://pyramid_user:CHANGE_ME@localhost:5432/pyramid_mahasiswa

[server:main]
use = egg:waitress#main
listen = 0.0.0.0:6543
