<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Kantin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Koperasi GK 2</h1>

  <div class="wrapper">
    <form id="form-barang">
      <h2>Tambah Barang</h2>

      <label for="nama">Nama Barang</label>
      <input type="text" id="nama">
      <p class="error" id="error-nama"></p>

      <label for="harga">Harga Satuan (Rp)</label>
      <input type="number" id="harga">
      <p class="error" id="error-harga"></p>

      <label for="jumlah">Jumlah</label>
      <input type="number" id="jumlah">
      <p class="error" id="error-jumlah"></p>

      <button type="submit">Tambah</button>
    </form>

    <div>
      <h2>Keranjang</h2>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Barang</th>
              <th>Harga Satuan</th>
              <th>QTY</th>
              <th>Subtotal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="isi-keranjang"></tbody>
        </table>
      </div>

      <div class="struk">
        <label for="promo">Kode Promo</label>
        <input type="text" id="promo">
        <p class="info" id="info-diskon"></p>

        <div class="baris"><span>Total belanja</span><span id="total">Rp 0</span></div>
        <div class="baris"><span>Diskon</span><span id="diskon">Rp 0</span></div>
        <div class="baris besar"><span>Total akhir</span><span id="total-akhir">Rp 0</span></div>

        <label for="bayar">Uang Bayar (Rp)</label>
        <input type="number" id="bayar">
        <p id="kembalian"></p>
      </div>

      <button type="button" id="btn-reset" class="abu">Transaksi Baru</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
